<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Almanca Flashkartlar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --card:#fff;
  --gold:#f5a623;
  --der:#4a90d9;
  --die:#e05a7a;
  --das:#3daa6e;
  --txt:#1a1a2e;
  --sh2:0 12px 48px rgba(0,0,0,.22);
}
body{
  background:linear-gradient(160deg,#1a8fe0 0%,#0fc9a0 100%);
  background-attachment:fixed;
  font-family:'Nunito',sans-serif;
  color:var(--txt);
  min-height:100dvh;
  display:flex;flex-direction:column;
}
.hdr{
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.25);
  padding:11px 16px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:99;gap:8px;
}
.logo{font-size:1rem;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.15)}
.logo-sub{font-size:.58rem;color:rgba(255,255,255,.8);letter-spacing:.8px;text-transform:uppercase;margin-top:1px}
.hdr-m{flex:1;text-align:center}
.ctr{font-size:.78rem;color:#fff;font-weight:700}
.prog{height:5px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin:4px auto 0;max-width:160px}
.pf{height:100%;background:#fff;border-radius:99px;transition:width .3s}
.fsbtn{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:5px 12px;font-size:.65rem;font-family:inherit;cursor:pointer;font-weight:700}
.legend{display:flex;gap:14px;justify-content:center;padding:7px 16px 4px;font-size:.72rem;font-weight:700;color:rgba(255,255,255,.92)}
.ldot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}
.li{display:flex;align-items:center}
.sec-bar{display:flex;overflow-x:auto;gap:6px;padding:6px 14px 7px;scrollbar-width:none}
.sec-bar::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:5px 13px;border-radius:99px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:rgba(255,255,255,.9);font-size:.7rem;font-weight:700;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all .15s}
.stab.on{background:#fff;border-color:#fff;color:#1a8fe0;font-weight:800}
.nav{padding:6px 14px;display:flex;align-items:center;gap:7px;justify-content:center}
.ni{background:rgba(255,255,255,.9);border:none;color:var(--txt);border-radius:8px;padding:5px 8px;font-family:inherit;font-size:.76rem;width:65px;text-align:center;font-weight:700}
.nl{font-size:.7rem;color:rgba(255,255,255,.88);font-weight:600}
.ng{background:#fff;border:none;color:#1a8fe0;border-radius:8px;padding:5px 11px;font-family:inherit;font-size:.7rem;font-weight:800;cursor:pointer}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 12px 8px}
.scene{width:100%;max-width:640px;perspective:1400px}
.cw{width:100%;height:460px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer;-webkit-tap-highlight-color:transparent}
.cw.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh2);background:var(--card)}
.abar{height:7px;width:100%;flex-shrink:0;background:#e8eaf0}
.abar.der{background:var(--der)}.abar.die{background:var(--die)}.abar.das{background:var(--das)}
.em-area{display:flex;align-items:center;justify-content:center;padding:12px 20px 2px;flex-shrink:0;background:linear-gradient(180deg,#f0f8ff 0%,#fff 100%)}
.em-big{font-size:3.8rem;line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.1))}
.abadge{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;padding:2px 10px;font-size:.82rem;font-weight:800;color:#fff;margin:0 auto 2px}
.abadge.der{background:var(--der)}.abadge.die{background:var(--die)}.abadge.das{background:var(--das)}.abadge.h{display:none}

/* ── WORD TITLE (büyük) ── */
.wt{font-family:'Playfair Display',serif;font-size:2.1rem;font-weight:900;color:#1a1a2e;line-height:1.15;text-align:center;padding:2px 14px 0}

/* ── CARD BODY ── */
.cbody{flex:1;overflow-y:auto;padding:6px 14px 10px;display:flex;flex-direction:column;gap:5px}
.cbody::-webkit-scrollbar{width:3px}
.cbody::-webkit-scrollbar-thumb{background:#ddd;border-radius:99px}
.ftip{text-align:center;font-size:.56rem;color:#bbb;font-weight:600;padding:3px 0 8px;flex-shrink:0}

/* ── CONJUGATION TABLE ── */
.conj-table{background:#f8f9fc;border-radius:10px;overflow:hidden;flex-shrink:0}
.conj-row{display:flex;align-items:center;padding:5px 10px;border-bottom:1px solid #eef0f5;gap:8px}
.conj-row:last-child{border-bottom:none}
.conj-label{font-size:.65rem;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:.8px;width:80px;flex-shrink:0}
.conj-val{font-size:.88rem;font-weight:700;color:#1a1a2e;line-height:1.3}
.conj-row.k2 .conj-label{color:#7c5cba}
.conj-row.k2 .conj-val{color:#7c5cba}
.conj-row.rk .conj-label{color:#e07030}
.conj-row.rk .conj-val{color:#e07030;font-size:.82rem;font-weight:600}

/* ── EXAMPLE ── */
.ex{font-size:.95rem;color:#2d2d3a;line-height:1.65;background:#f8f9fc;border-radius:9px;padding:7px 12px;border-left:3px solid var(--gold);font-weight:600}
.ex.fixed{background:#fffbf0;border-left-color:#f5c842;color:#664400;font-style:italic;font-size:.88rem}
.ex.bullet{background:transparent;border:none;color:#666;font-size:.85rem;padding:1px 6px;font-weight:700}
.ex.bullet::before{content:"• ";color:var(--gold);font-weight:900}

/* ── BACK ── */
.fb2{transform:rotateY(180deg)}
.tm-area{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px 4px;flex-shrink:0;background:linear-gradient(180deg,#edfaf3 0%,#fff 100%)}
.tm-em{font-size:2.2rem;margin-bottom:4px}
.tm{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:#16803c;line-height:1.18;text-align:center}
.td{font-size:.95rem;color:#2d2d3a;line-height:1.65;background:#edfaf3;border-radius:9px;padding:7px 12px;border-left:3px solid #22c55e;font-weight:600}
.tpos{text-align:center;font-size:.56rem;color:#bbb;font-weight:600;padding:3px 0 8px;flex-shrink:0}

.hint{font-size:.58rem;color:rgba(255,255,255,.65);letter-spacing:.7px;text-transform:uppercase;margin-top:5px;text-align:center;font-weight:600}
.cpos{font-size:.7rem;color:rgba(255,255,255,.85);text-align:center;margin-top:3px;font-weight:700}
.btns{display:flex;gap:8px;width:100%;max-width:640px;padding:7px 0 4px}
.btn{flex:1;padding:14px 0;border:none;border-radius:14px;font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:disabled{opacity:.28;cursor:default}
.btn:active:not(:disabled){transform:scale(.97)}
.bp,.bn{background:rgba(245,166,35,.25);color:#fff;border:1.5px solid rgba(245,166,35,.5);max-width:110px}
.bf{background:#f5a623;color:#fff;font-weight:900;box-shadow:0 4px 20px rgba(245,166,35,.4)}
.comp{display:none;flex-direction:column;align-items:center;gap:14px;padding:36px 20px;text-align:center}
.comp.on{display:flex}
.comp-h{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:#fff}
.comp-p{color:rgba(255,255,255,.85);max-width:300px;font-size:.92rem;font-weight:600}
.comp-btn{background:#f5a623;color:#fff;border:none;border-radius:14px;padding:12px 32px;font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer;margin-top:4px}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="logo">Almanca Flashkartlar</div><div class="logo-sub">B2-C1 &middot; 21 Bolum &middot; 1040 Kart</div></div>
  <div class="hdr-m"><div class="ctr" id="ctr">-</div><div class="prog"><div class="pf" id="pf" style="width:0%"></div></div></div>
  <button class="fsbtn" id="fsbtn" onclick="toggleFS()">Tam Ekran</button>
</div>
<div class="legend">
  <div class="li"><span class="ldot" style="background:#4a90d9"></span>der</div>
  <div class="li"><span class="ldot" style="background:#e05a7a"></span>die</div>
  <div class="li"><span class="ldot" style="background:#3daa6e"></span>das</div>
</div>
<div class="sec-bar" id="secBar"></div>
<div class="nav">
  <span class="nl">Kart:</span>
  <input class="ni" id="ni" type="number" min="1" onkeydown="if(event.key==='Enter')goTo()">
  <button class="ng" onclick="goTo()">Git</button>
  <span class="nl" id="nt"></span>
</div>
<div class="stage">
  <div class="scene" id="scene">
    <div class="cw" id="card" onclick="doFlip()">
      <div class="face" id="fFront">
        <div class="abar" id="ab1"></div>
        <div class="em-area"><div class="em-big" id="emEl">📖</div></div>
        <div style="text-align:center;padding:0 0 2px"><div class="abadge h" id="abadge"></div></div>
        <div class="wt" id="wtEl"></div>
        <div class="cbody" id="deB"></div>
        <div class="ftip">Turkce anlam icin cevir ↓</div>
      </div>
      <div class="face fb2">
        <div class="abar" id="ab2"></div>
        <div class="tm-area">
          <div class="tm-em" id="emEl2">📖</div>
          <div class="tm" id="tmEl"></div>
        </div>
        <div class="cbody" id="trB"></div>
        <div class="tpos" id="tpos"></div>
      </div>
    </div>
    <div class="hint">Tikla / Bosluk = cevir &nbsp;·&nbsp; ← → veya kaydır = gecis</div>
  </div>
  <div class="cpos" id="cpos"></div>
  <div class="btns" id="btns">
    <button class="btn bp" id="bP" onclick="goPrev()">← Onceki</button>
    <button class="btn bf" onclick="doFlip()">↺ Cevir</button>
    <button class="btn bn" id="bN" onclick="goNext()">Sonraki →</button>
  </div>
  <div class="comp" id="comp">
    <div style="font-size:3rem">🎉</div>
    <div class="comp-h">Bolum Tamamlandi!</div>
    <div class="comp-p" id="cMsg"></div>
    <button class="comp-btn" id="cBtn">Devam →</button>
  </div>
</div>
<script>
var D=[{"s":1,"emoji":"🔧","dt":"instandgesetzt","dc":"instandsetzen (er setzt instand – er setzte instand – er hat instandgesetzt)","de":"Das Auto wurde instandgesetzt und fährt wieder einwandfrei.","tm":"onarılmış, tamir edilmiş","td":"Araba onarıldı ve tekrar sorunsuz çalışıyor.\ninstand = çalışır durumda instandgesetzt = çalışır duruma getirilmiş","art":"","praesens":"er setzt instand","praeteritum":"er setzte instand","perfekt":"er hat instandgesetzt","konj2":"er würde instandsetzen"},{"s":1,"emoji":"🤝","dt":"Gegenseitigkeit","dc":"","de":"Eine gute Beziehung basiert auf Gegenseitigkeit.","tm":"karşılıklılık","td":"İyi bir ilişki karşılıklılığa dayanır","art":""},{"s":1,"emoji":"✋","dt":"unterbrechen","dc":"er unterbricht – er unterbrach – er hat unterbrochen","de":"Bitte unterbrechen Sie mich nicht während der Präsentation!","tm":"Kesmek, ara vermek","td":"Lütfen sunum sırasında sözümü kesmeyin!","art":"","praesens":"er unterbricht","praeteritum":"er unterbrach","perfekt":"er hat unterbrochen","konj2":"er unterbrächte","rektion":"unterbrechen + Akkusativ"},{"s":1,"emoji":"🧠","dt":"nachvollziehen","dc":"er vollzieht nach – er vollzog nach – er hat nachvollzogen","de":"Ich versuche, deine Perspektive nachzuvollziehen.","tm":"anlamak / mantığını kavramak/ bir süreci adım adım takip etmek","td":"Bakış açını anlamaya çalışıyorum.","art":"","praesens":"er vollzieht nach","praeteritum":"er vollzog nach","perfekt":"er hat nachvollzogen","konj2":"er würde nachvollziehen","rektion":"nachvollziehen + Akkusativ"},{"s":1,"emoji":"⚙️","dt":"ausgeklügelten","dc":"","de":"• bein ausgeklügeltes System\n• ein ausgeklügelter Plan\n• eine ausgeklügelte Strategie\nDas Unternehmen hat ein ausgeklügeltes System entwickelt.","tm":"çok iyi düşünülmüş","td":"Şirket çok iyi düşünülmüş bir sistem geliştirdi.","art":"","praesens":"er ausgeklügeltet","praeteritum":"er ausgeklügeltete","perfekt":"er hat geausgeklügeltet","konj2":"er würde ausgeklügelten"},{"s":1,"emoji":"🎁","dt":"eine beliebte","dc":"","de":"Gutscheine sind eine beliebte\nGeschenkoption zu Weihnachten.","tm":"popüler / tercih (sevilen) edilen bir hediye seçeneği","td":"Hediye çekleri Noel’de popüler bir hediye seçeneğidir.","art":""},{"s":1,"emoji":"✅","dt":"gelingen (dativ)","dc":"es gelingt – es gelang – es ist gelungen","de":"Das Experiment ist mir endlich gelungen!","tm":"Başarmak, başarılı olmak","td":"Deney sonunda bana başarılı oldu (daha doğal: Deneyi sonunda başardım)","art":"","praesens":"es gelingt","praeteritum":"es gelang","perfekt":"es ist gelungen","konj2":"es gelänge"},{"s":1,"emoji":"🎭","dt":"sich verhalten","dc":"er verhält sich – er verhielt sich – er hat sich verhalten","de":"Er verhält sich sehr seltsam in letzter Zeit.","tm":"Davranmak","td":"Son zamanlarda çok garip davranıyor.","art":"","praesens":"er verhält sich","praeteritum":"er verhielt sich","perfekt":"er hat sich verhalten","konj2":"er würde sich verhalten","rektion":"sich verhalten + gegenüber + Dativ / zu + Dativ"},{"s":1,"emoji":"😟","dt":"befürchten","dc":"er befürchtet – er befürchtete – er hat befürchtet","de":"Ich befürchte, dass wir zu spät kommen.","tm":"Korkmak, endişelenmek","td":"Çok geç kalacağımızdan korkuyorum","art":"","praesens":"er befürchtet","praeteritum":"er befürchtete","perfekt":"er hat befürchtet","konj2":"er würde befürchten"},{"s":1,"emoji":"📰","dt":"erscheinen","dc":"er erscheint – er erschien – er ist erschienen","de":"Das neue Buch erscheint nächste Woche.","tm":"Görünmek, yayınlanmak","td":"Yeni kitap gelecek hafta yayınlanıyor.","art":"","praesens":"er erscheint","praeteritum":"er erschien","perfekt":"er ist erschienen","konj2":"er erschiene"},{"s":1,"emoji":"📦","dt":"benötigen","dc":"er benötigt – er benötigte – er hat benötigt","de":"Ich benötige mehr Zeit für dieses Projekt.","tm":"ihtiyaç duymak","td":"Bu proje için daha fazla zamana ihtiyacım var.","art":"","praesens":"er benötigt","praeteritum":"er benötigte","perfekt":"er hat benötigt","konj2":"er würde benötigen"},{"s var S={};for(var i=0;i<D.length;i++){var s=D[i].s;if(!S[s])S[s]=[];S[s].push(i);}
var K=Object.keys(S).map(Number).sort(function(a,b){return a-b;});
var cs=K[0],gi=0,fl=false,fsM=false;
function sa(){return S[cs];}
function mk(cls,txt){var d=document.createElement('div');d.className=cls;if(txt!==undefined)d.textContent=txt;return d;}
function mkRow(label,val,cls){
  var row=mk('conj-row'+(cls?' '+cls:''));
  var lb=mk('conj-label');lb.textContent=label;
  var vl=mk('conj-val');vl.textContent=val;
  row.appendChild(lb);row.appendChild(vl);
  return row;
}
function lc(l){
  if(/^[\u2022\u00b7\*]/.test(l))return 'ex bullet';
  if(/^[A-Z\u00c4\u00d6\u00dc]/.test(l))return 'ex';
  return 'ex fixed';
}
function setArt(id,art){document.getElementById(id).className='abar'+(art?' '+art:'');}
function render(){
  fl=false;document.getElementById('card').classList.remove('flip');
  var c=D[gi],a=sa(),li=a.indexOf(gi),tot=a.length;
  var art=c.art||'';
  var em=c.emoji||'\uD83D\uDCDA';
  setArt('ab1',art);setArt('ab2',art);
  document.getElementById('emEl').textContent=em;
  document.getElementById('emEl2').textContent=em;
  var b=document.getElementById('abadge');
  if(art){b.className='abadge '+art;b.textContent=art;}else b.className='abadge h';
  document.getElementById('wtEl').textContent=c.dt||'';

  // ── FRONT BODY ──
  var dB=document.getElementById('deB');dB.innerHTML='';

  // Çekim tablosu
  var hasPr=c.praesens&&c.praesens.trim();
  var hasPt=c.praeteritum&&c.praeteritum.trim();
  var hasPf=c.perfekt&&c.perfekt.trim();
  var hasK2=c.konj2&&c.konj2.trim();
  var hasRk=c.rektion&&c.rektion.trim();

  if(hasPr||hasPt||hasPf||hasK2){
    var tbl=mk('conj-table');
    if(hasPr)tbl.appendChild(mkRow('Präsens',c.praesens,''));
    if(hasPt)tbl.appendChild(mkRow('Präteritum',c.praeteritum,''));
    if(hasPf)tbl.appendChild(mkRow('Perfekt',c.perfekt,''));
    if(hasK2)tbl.appendChild(mkRow('Konj. II',c.konj2,'k2'));
    if(hasRk)tbl.appendChild(mkRow('Rektion',c.rektion,'rk'));
    dB.appendChild(tbl);
  } else if(c.dc&&c.dc.trim()){
    // Eski format (dc)
    var tbl2=mk('conj-table');
    tbl2.appendChild(mkRow('Çekim',c.dc,''));
    dB.appendChild(tbl2);
  }

  // Örnek cümleler
  if(c.de&&c.de.trim()){
    var ls=c.de.split('\n').map(function(l){return l.trim();}).filter(Boolean);
    var ss=[],os=[];
    ls.forEach(function(l){if(lc(l)==='ex')ss.push(l);else os.push(l);});
    os.forEach(function(l){var cl=lc(l);dB.appendChild(mk(cl,cl==='ex bullet'?l.replace(/^[\u2022\u00b7\*]\s*/,''):l));});
    ss.forEach(function(l){dB.appendChild(mk('ex',l));});
  }

  // ── BACK BODY ──
  document.getElementById('tmEl').textContent=c.tm||'';
  var tB=document.getElementById('trB');tB.innerHTML='';
  if(c.td&&c.td.trim())c.td.split('\n').forEach(function(l){l=l.trim();if(l)tB.appendChild(mk('td',l));});

  document.getElementById('tpos').textContent='Bolum '+cs+' \u00b7 '+(li+1)+' / '+tot;
  document.getElementById('cpos').textContent='Bolum '+cs+' \u00b7 Kart '+(li+1)+' / '+tot;
  document.getElementById('pf').style.width=((gi+1)/D.length*100)+'%';
  document.getElementById('ctr').textContent='Bolum '+cs+' \u00b7 '+(li+1)+'/'+tot;
  document.getElementById('ni').value=li+1;
  document.getElementById('nt').textContent='/ '+tot;
  document.getElementById('bP').disabled=(li===0);
  document.getElementById('bN').disabled=(li>=tot-1);
  renderTabs();
}
function renderTabs(){
  var bar=document.getElementById('secBar');bar.innerHTML='';
  K.forEach(function(s){
    var t=mk('stab'+(s===cs?' on':''),'B'+s+' ('+S[s].length+')');
    t.onclick=function(){cs=s;gi=S[s][0];show();render();};
    bar.appendChild(t);
  });
  var a=bar.querySelector('.on');if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
function goTo(){var v=parseInt(document.getElementById('ni').value,10),a=sa();if(v>=1&&v<=a.length){gi=a[v-1];render();}}
function doFlip(){fl=!fl;document.getElementById('card').classList.toggle('flip',fl);}
function goNext(){
  var a=sa(),li=a.indexOf(gi);
  if(li<a.length-1){gi=a[li+1];render();return;}
  document.getElementById('scene').style.display='none';
  document.getElementById('btns').style.display='none';
  document.getElementById('cpos').style.display='none';
  document.getElementById('comp').classList.add('on');
  var ni=K.indexOf(cs)+1,ns=K[ni];
  if(ns){document.getElementById('cMsg').textContent=a.length+' kelime tamam! Bolum '+ns+' basliyor.';document.getElementById('cBtn').textContent='Bolum '+ns+' \u2192';document.getElementById('cBtn').onclick=function(){cs=ns;gi=S[ns][0];show();render()};}
  else{document.getElementById('cMsg').textContent='Tum 21 bolumu tamamladin!';document.getElementById('cBtn').textContent='Bastan Basla';document.getElementById('cBtn').onclick=function(){cs=K[0];gi=0;show();render()};}
}
function goPrev(){var a=sa(),li=a.indexOf(gi);if(li>0){gi=a[li-1];render();return;}if(K.indexOf(cs)>0){var ps=K[K.indexOf(cs)-1];cs=ps;gi=S[ps][S[ps].length-1];render();}}
function show(){document.getElementById('scene').style.display='';document.getElementById('btns').style.display='';document.getElementById('cpos').style.display='';document.getElementById('comp').classList.remove('on');}
function toggleFS(){
  if(!fsM){var el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();document.getElementById('fsbtn').textContent='Cik';fsM=true;}
  else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();document.getElementById('fsbtn').textContent='Tam Ekran';fsM=false;}
}
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement){fsM=false;document.getElementById('fsbtn').textContent='Tam Ekran';}});
document.addEventListener('webkitfullscreenchange',function(){if(!document.webkitFullscreenElement){fsM=false;document.getElementById('fsbtn').textContent='Tam Ekran';}});
var tx=0,ty=0;
document.getElementById('scene').addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.getElementById('scene').addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>45){if(dx<0)goNext();else goPrev();}},{passive:true});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')goNext();else if(e.key==='ArrowLeft')goPrev();else if(e.key===' '){e.preventDefault();doFlip();}});
render();
</script></body></html>
